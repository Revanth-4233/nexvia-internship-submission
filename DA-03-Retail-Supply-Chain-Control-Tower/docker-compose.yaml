version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: control_tower_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-supply_chain_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-supply_chain_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control_tower_net

  airflow-init:
    image: apache/airflow:2.7.3-python3.10
    container_name: control_tower_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@postgres:5432/${DB_NAME:-supply_chain_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname SupplyChain \
          --lastname Admin \
          --role Admin \
          --email admin@controltower.com
    restart: "no"
    networks:
      - control_tower_net

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    container_name: control_tower_airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@postgres:5432/${DB_NAME:-supply_chain_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: control_tower_airflow_secret_key_12345
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - control_tower_net

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    container_name: control_tower_airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@postgres:5432/${DB_NAME:-supply_chain_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - control_tower_net

  superset:
    image: apache/superset:3.0.0
    container_name: control_tower_superset
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: superset_secret_key_control_tower_54321
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@postgres:5432/${DB_NAME:-supply_chain_db}
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
    entrypoint: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@controltower.com --password admin &&
      superset init &&
      /usr/bin/run-server.sh
      "
    networks:
      - control_tower_net

volumes:
  postgres_data:
  airflow_logs:
  superset_data:

networks:
  control_tower_net:
    driver: bridge
