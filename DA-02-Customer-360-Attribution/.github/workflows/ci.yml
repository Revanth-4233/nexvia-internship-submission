name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install dbt-core dbt-duckdb duckdb pandas numpy matplotlib pytest
      - run: cp dbt/profiles.yml.example dbt/profiles.yml
      - name: Generate data, load, build & test every dbt model
        run: make data load dbt
      - name: Markov attribution + exports
        run: make markov export
      - name: Python unit tests
        run: make test
