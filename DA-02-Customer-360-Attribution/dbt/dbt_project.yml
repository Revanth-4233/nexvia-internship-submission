name: c360_attribution
version: "1.0.0"
config-version: 2
profile: c360_attribution

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  attribution_lookback_days: 30      # touchpoints older than this before a conversion get no credit
  time_decay_half_life_days: 7       # time-decay model: credit halves every N days before conversion
  session_timeout_minutes: 30        # app sessionization (Segment has no session id)
  position_based_first_weight: 0.4   # U-shaped model: 40% first, 40% last, 20% spread over the middle
  position_based_last_weight: 0.4

models:
  c360_attribution:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  c360_attribution:
    +schema: seeds
